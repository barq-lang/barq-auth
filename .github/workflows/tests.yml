name: tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      # The package and the repos it needs are cloned side by side, the way barq finds them.
      - uses: actions/checkout@v4
        with:
          path: barq-auth
      - uses: actions/checkout@v4
        with:
          repository: barq-lang/barq
          path: barq
      - uses: actions/checkout@v4
        with:
          repository: barq-lang/barq-framework
          path: barq-framework
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Tests
        working-directory: barq-auth
        run: python tests/test_auth.py
